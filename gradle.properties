# JVM options for Gradle daemon: disable memory mapping to prevent Windows file lock errors
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.zip.disableMemoryMapping=true -Dsun.io.useCanonCaches=false -Dorg.gradle.internal.filesystem.watch.enabled=false

# Disable Gradle VFS file watching which holds memory-mapped file handles on Windows
org.gradle.vfs.watch=false

# Pass memory-mapping disable flag to Kotlin daemon
kotlin.daemon.jvm.options=-Dsun.zip.disableMemoryMapping=true

# Kotlin compiler strategy and incremental compilation settings for Windows stability
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# AndroidX and Kotlin code style
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
